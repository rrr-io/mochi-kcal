    <title>Mochi Kcal</title>

    <!-- splash:css -->
    <style id="splash-css">
      /* Self-hosted so the splash has its face from the very first paint, offline too */
      @font-face {
        font-family: "Baloo Splash";
        src: url("/fonts/baloo-2-800.woff2") format("woff2");
        font-weight: 800;
        font-display: block;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(38% 22% at 18% 20%, #fde3ea 0%, transparent 70%),
          radial-gradient(42% 24% at 86% 30%, #ece5fc 0%, transparent 70%),
          radial-gradient(46% 26% at 22% 84%, #e2f2fc 0%, transparent 70%),
          radial-gradient(44% 24% at 84% 80%, #ffe9db 0%, transparent 70%),
          linear-gradient(180deg, #f3fbf9 0%, #ddf6f1 100%);
        color: #41605c;
        font-family: "Baloo Splash", "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
        transition: opacity 0.5s ease, transform 0.5s ease;
        /* safety net: never cover the app for more than a few seconds */
        animation: sp-auto 0.5s 7s forwards;
      }
      #splash.bye { opacity: 0; transform: scale(1.06); pointer-events: none; }
      @keyframes sp-auto { to { opacity: 0; visibility: hidden; } }

      .sp-in { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: -6vh; }

      .sp-duo { display: flex; gap: 18px; align-items: flex-end; margin-bottom: 18px; }
      .sp-pal { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .sp-m { width: 104px; height: 104px; transform-origin: 50% 100%; animation: sp-hop 1.2s cubic-bezier(.45, 0, .55, 1) infinite; }
      .sp-m svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .sp-pal + .sp-pal .sp-m, .sp-pal + .sp-pal .sp-sh { animation-delay: -0.6s; }
      .sp-sh { width: 62px; height: 10px; border-radius: 50%; background: #3eaa9b; opacity: 0.16; animation: sp-shadow 1.2s cubic-bezier(.45, 0, .55, 1) infinite; }
      @keyframes sp-hop {
        0%, 100% { transform: translateY(0) scale(1.07, 0.93); }
        18% { transform: translateY(-6px) scale(0.97, 1.04); }
        50% { transform: translateY(-30px) scale(1, 1) rotate(-4deg); }
        82% { transform: translateY(-6px) scale(0.98, 1.02); }
      }
      @keyframes sp-shadow { 0%, 100% { transform: scaleX(1); opacity: 0.18; } 50% { transform: scaleX(0.55); opacity: 0.08; } }

      .sp-eyes { transform-origin: 20px 20px; transform-box: view-box; animation: sp-blink 3.4s infinite; }
      .sp-pal + .sp-pal .sp-eyes { animation-delay: 1.1s; }
      @keyframes sp-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }

      .sp-name { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: 0.01em; }
      .sp-name b { color: #3eaa9b; font-weight: 800; }
      .sp-tag { font-size: 16px; font-weight: 800; color: #8faaa6; letter-spacing: 0.02em; min-height: 1.4em; }

      .sp-dots { display: flex; gap: 7px; margin-top: 16px; }
      .sp-dots i { width: 9px; height: 9px; border-radius: 50%; animation: sp-dot 1s ease-in-out infinite; }
      .sp-dots i:nth-child(1) { background: #8edfd2; }
      .sp-dots i:nth-child(2) { background: #f5a8be; animation-delay: 0.15s; }
      .sp-dots i:nth-child(3) { background: #b7a5ee; animation-delay: 0.3s; }
      @keyframes sp-dot { 0%, 100% { transform: translateY(0); opacity: 0.45; } 50% { transform: translateY(-6px); opacity: 1; } }

      .sp-tw { position: absolute; width: 22px; height: 22px; animation: sp-twinkle 2.4s ease-in-out infinite; }
      .sp-tw svg { display: block; width: 100%; height: 100%; }
      .sp-tw.a { top: 18%; left: 14%; } .sp-tw.b { top: 26%; right: 16%; width: 16px; height: 16px; animation-delay: 0.6s; }
      .sp-tw.c { top: 64%; left: 12%; width: 14px; height: 14px; animation-delay: 1.2s; } .sp-tw.d { top: 70%; right: 14%; animation-delay: 1.8s; }
      .sp-tw.e { top: 12%; right: 38%; width: 12px; height: 12px; animation-delay: 0.9s; } .sp-tw.f { bottom: 14%; left: 44%; width: 14px; height: 14px; animation-delay: 1.5s; }
      @keyframes sp-twinkle { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(0.55) rotate(45deg); opacity: 0.5; } }

      #splash.still *, #splash.still { animation: none !important; }
      @media (prefers-reduced-motion: reduce) {
        #splash * { animation: none !important; }
        #splash { transition-duration: 0.2s; }
      }
    </style>
    <!-- /splash:css -->
  </head>
  <body>
    <!-- splash:html -->
    <div id="splash" aria-hidden="true">
      <span class="sp-tw a"><svg viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z" fill="#f5a8be"/></svg></span>
      <span class="sp-tw b"><svg viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z" fill="#b7a5ee"/></svg></span>
      <span class="sp-tw c"><svg viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z" fill="#8edfd2"/></svg></span>
      <span class="sp-tw d"><svg viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z" fill="#fdba92"/></svg></span>
      <span class="sp-tw e"><svg viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z" fill="#95cdee"/></svg></span>
      <span class="sp-tw f"><svg viewBox="0 0 24 24"><path d="M12 1c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z" fill="#f5a8be"/></svg></span>

                <path d="M18.3 23.2q1.7 1.6 3.4 0" stroke="#41605c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
                <circle cx="13.6" cy="23.4" r="1.6" fill="#f5a8be"/><circle cx="26.4" cy="23.4" r="1.6" fill="#f5a8be"/>
              </svg>
            </div>
            <div class="sp-sh"></div>
          </div>
          <div class="sp-pal">
            <div class="sp-m">
              <svg viewBox="0 0 40 40">
                <g fill="#bfe3f7"><circle cx="20" cy="10.5" r="7.6"/><circle cx="30" cy="17.8" r="7.6"/><circle cx="26.2" cy="29.5" r="7.6"/><circle cx="13.8" cy="29.5" r="7.6"/><circle cx="10" cy="17.8" r="7.6"/><circle cx="20" cy="21" r="10"/></g>
                <g class="sp-eyes"><circle cx="16.2" cy="20.2" r="1.7" fill="#41605c"/><circle cx="23.8" cy="20.2" r="1.7" fill="#41605c"/><circle cx="16.7" cy="19.6" r=".5" fill="#fff"/><circle cx="24.3" cy="19.6" r=".5" fill="#fff"/></g>
                <path d="M18.3 23.2q1.7 1.6 3.4 0" stroke="#41605c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
                <circle cx="13.6" cy="23.4" r="1.6" fill="#f5a8be"/><circle cx="26.4" cy="23.4" r="1.6" fill="#f5a8be"/>
              </svg>
            </div>
            <div class="sp-sh"></div>
          </div>
        </div>
        <div class="sp-name">Mochi <b>Kcal</b></div>
        <div class="sp-tag" id="sp-tag"></div>
        <div class="sp-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var lines = ["counting calories, not worries", "sip, snack, smile", "tiny bites, big wins", "hydrated & adorable", "one glass at a time"];
        var el = document.getElementById("sp-tag");
        if (el) el.textContent = lines[Math.floor(Math.random() * lines.length)];
      })();
    </script>
    <!-- /splash:html -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
